<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körperteile &amp; Fußwaschung – Lernspiel</title>
<style>
:root{--blau:#2b6a8f;--blau-h:#e3eff6;--orange:#f39c3d;--gruen:#2e9b57;--gruen-h:#e2f4e8;--rot:#c9413a;--rot-h:#fbe6e4;--text:#1d2329;--grau:#6b7580;--bg:#f6f7f9;--karte:#fff;--rand:#dde2e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:18px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--karte);border-bottom:1px solid var(--rand);position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--rand);background:var(--karte);border-radius:12px;padding:10px 16px;color:var(--text)}
button:hover{border-color:var(--blau)}
button.primary{background:var(--blau);color:#fff;border-color:var(--blau)}
.home-btn{display:none}
main{max-width:1100px;margin:0 auto;padding:16px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:10px}
.menu button{text-align:left;padding:20px;border-radius:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.menu .ico{font-size:42px;line-height:1}
.menu b{font-size:21px}
.menu span{color:var(--grau);font-size:15px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.pill{background:var(--karte);border:1px solid var(--rand);border-radius:999px;padding:6px 14px;font-weight:600}
.spacer{flex:1}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .35s}
@keyframes pp{50%{transform:scale(1.08)}}
/* Beschriften */
.lab{display:grid;grid-template-columns:minmax(260px,1fr) minmax(240px,340px);gap:16px;align-items:start}
.figwrap{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:8px;display:flex;justify-content:center}
.figin{position:relative;height:min(76vh,900px);aspect-ratio:1080/1470;max-width:100%}
.figin img{width:100%;height:100%;display:block}
.hot{position:absolute;width:6.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid transparent;background:transparent;padding:0}
.hot:hover{border-color:var(--orange)}
.hot.ok{background:var(--gruen);border-color:var(--gruen);color:#fff;font-weight:700;font-size:14px}
.hot.bad{background:var(--rot-h);border-color:var(--rot)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{padding:10px 14px;border-radius:10px;font-size:18px}
.word.sel{background:var(--orange);color:#fff;border-color:var(--orange)}
.word.done{background:var(--gruen-h);border-color:var(--gruen);color:var(--gruen);cursor:default}
.hint{color:var(--grau);font-size:15px;margin:6px 0 12px}
/* Quiz */
.quiz{display:grid;grid-template-columns:minmax(200px,360px) 1fr;gap:20px;align-items:center}
.quiz .bild{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:10px;text-align:center}
.quiz .bild img{height:min(62vh,600px);max-width:100%;object-fit:contain}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:26px;padding:22px 12px;border-radius:14px}
.opt.right{background:var(--gruen);color:#fff;border-color:var(--gruen)}
.opt.wrong{background:var(--rot-h);border-color:var(--rot)}
.teams{display:flex;gap:10px}
.team{padding:8px 16px;border-radius:12px;border:2px solid var(--rand);font-weight:700;background:#fff}
.team.on{border-color:var(--orange);box-shadow:0 0 0 3px #f39c3d44}
/* Hören */
.hear-top{display:flex;justify-content:center;margin:6px 0 16px}
.big-ear{font-size:64px;padding:16px 40px;border-radius:24px}
.picgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pic{background:#fff;padding:8px;border-radius:16px;border:3px solid var(--rand)}
.pic img{width:100%;max-height:44vh;object-fit:contain;display:block}
.pic.right{border-color:var(--gruen);background:var(--gruen-h)}
.pic.wrong{border-color:var(--rot);background:var(--rot-h)}
.stars{font-size:30px;letter-spacing:4px;text-align:center;min-height:40px}
/* Reihenfolge */
.order{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col h3{margin:0 0 8px;font-size:17px;color:var(--grau);font-weight:600}
.card{background:var(--karte);border:1px solid var(--rand);cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;border-radius:12px;font-size:18px}
.card .e{font-size:28px;flex:none;width:38px;text-align:center}
.card .t{flex:1}
.card .s{flex:none;border:none;background:none;padding:4px;font-size:20px}
.card.placed{background:var(--gruen-h);border-color:var(--gruen);cursor:default}
.card .n{flex:none;font-weight:800;color:var(--gruen);width:24px}
.done-box{background:var(--gruen-h);border:2px solid var(--gruen);border-radius:16px;padding:16px;text-align:center;font-size:22px;font-weight:700;margin:12px 0}
.toggle{display:flex;gap:6px}
.toggle button.on{background:var(--blau);color:#fff;border-color:var(--blau)}
@media (max-width:760px){.lab,.quiz,.order{grid-template-columns:1fr}.picgrid{grid-template-columns:1fr 1fr}.opt{font-size:22px;padding:16px 8px}}
</style>
</head>
<body>
<header>
  <h1 id="title">Körperteile &amp; Fußwaschung</h1>
  <button class="home-btn" id="home">☰ Menü</button>
</header>
<main id="app"></main>

const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- Ton ----
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("de"));voice=v.find(x=>/google|natural|online/i.test(x.name))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate=.85){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[„“]/g,""));u.lang="de-DE";u.rate=rate;if(voice)u.voice=voice;speechSynthesis.speak(u)}
let actx;
function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.1)}else{o.frequency.setValueAtTime(220,t);o.type="square"}
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}

// ---- Timer ----
let timerId=null;
function startTimer(el){const t0=Date.now();clearInterval(timerId);timerId=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);el.textContent="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},500);return ()=>{clearInterval(timerId);return Math.floor((Date.now()-t0)/1000)}}

// ---- Menü ----
function menu(){
  clearInterval(timerId);$("#home").style.display="none";$("#title").textContent="Körperteile & Fußwaschung";
  app.innerHTML=`<div class="menu">

   <button data-m="order"><span class="ico">👣</span><b>Fußwaschung: Reihenfolge</b><span>Die Schritte in die richtige Reihenfolge bringen.</span></button>
  </div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>({quiz,label,hear,order})[b.dataset.m]());
}
function enter(t){$("#home").style.display="inline-block";$("#title").textContent=t;clearInterval(timerId)}
$("#home").onclick=menu;

// ---- 1. Was ist orange? ----
function quiz(){
  enter("Was ist orange?");
  let deck=shuffle(PARTS),i=0,score=[0,0],teamMode=false,turn=0,points=0,locked=false;
  function draw(){
    if(i>=deck.length){
      app.innerHTML=`<div class="done-box">Fertig! ${teamMode?`Team A: ${score[0]} · Team B: ${score[1]}`:`${points} von ${deck.length} richtig`}</div><button class="primary" id="again">Nochmal</button>`;
      $("#again").onclick=quiz;return}
    const p=deck[i],opts=shuffle([p,...shuffle(PARTS.filter(x=>x!==p)).slice(0,3)]);locked=false;
    app.innerHTML=`<div class="bar"><span class="pill">${i+1} / ${deck.length}</span>
      <div class="toggle"><button id="solo" class="${teamMode?"":"on"}">Allein</button><button id="tm" class="${teamMode?"on":""}">2 Teams</button></div>
      <span class="spacer"></span>${teamMode?`<div class="teams"><span class="team ${turn==0?"on":""}">Team A: ${score[0]}</span><span class="team ${turn==1?"on":""}">Team B: ${score[1]}</span></div>`:`<span class="pill">⭐ ${points}</span>`}</div>
      <div class="quiz"><div class="bild"><img src="${IMG[p.k]}" alt="Körper mit orange markiertem Teil"></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-k="${o.k}">${o.w}</button>`).join("")}</div></div>`;
    $("#solo").onclick=()=>{teamMode=false;draw()};$("#tm").onclick=()=>{teamMode=true;draw()};
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(locked)return;
      if(b.dataset.k===p.k){locked=true;b.classList.add("right");beep(true);say(p.w);if(teamMode)score[turn]++;else points++;
        setTimeout(()=>{i++;if(teamMode)turn=1-turn;draw()},1300)}
      else{b.classList.add("wrong");anim(b,"shake");beep(false);
        if(teamMode){locked=true;const r=app.querySelector(`.opt[data-k="${p.k}"]`);r.classList.add("right");say(p.w);setTimeout(()=>{i++;turn=1-turn;draw()},1800)}}
    });
  }
  draw();
}

// ---- 2. Beschriften ----
function label(){
  enter("Beschriften");
  let sel=null,errors=0,done=0;
  const words=shuffle(PARTS);
  app.innerHTML=`<div class="bar"><span class="pill" id="tm">⏱ 0:00</span><span class="pill" id="pr">✅ 0 / 18</span><span class="pill" id="er">❌ 0</span><span class="spacer"></span><button id="re">Neu starten</button></div>
   <p class="hint">1. Wort antippen &nbsp;→&nbsp; 2. passende Nummer am Körper antippen. Gestrichelte Linie = Rückseite.</p>
   <div class="lab"><div class="figwrap" id="fig"><div class="figin"><img src="${IMG.grund}" alt="Körperumriss mit Nummern 1 bis 18">
   ${PARTS.map(p=>`<button class="hot" data-n="${p.n}" style="left:${p.n<=10?93.9:5.4}%;top:${(POS[p.n]-165)/735*100}%" aria-label="Nummer ${p.n}"></button>`).join("")}</div></div>
   <div><div class="words">${words.map(p=>`<button class="word" data-n="${p.n}">${p.w}</button>`).join("")}</div><div id="fin"></div></div></div>`;
  const stop=startTimer($("#tm"));$("#re").onclick=label;
  app.querySelectorAll(".word").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;app.querySelectorAll(".word").forEach(x=>x.classList.remove("sel"));sel=b;b.classList.add("sel");say(b.textContent)});
  app.querySelectorAll(".hot").forEach(h=>h.onclick=()=>{
    if(!sel||h.classList.contains("ok"))return;
    if(sel.dataset.n===h.dataset.n){h.classList.add("ok");h.textContent="✓";sel.classList.remove("sel");sel.classList.add("done");sel.textContent=sel.dataset.n+" · "+sel.textContent;sel=null;done++;beep(true);$("#pr").textContent=`✅ ${done} / 18`;
      if(done===18){const s=stop();$("#fin").innerHTML=`<div class="done-box">Super! Zeit: ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} · Fehler: ${errors}</div>`}}
    else{errors++;$("#er").textContent="❌ "+errors;beep(false);h.classList.add("bad");anim(h,"shake");anim(sel,"shake");setTimeout(()=>h.classList.remove("bad"),500)}
  });
}

// ---- 3. Hören & Zeigen ----
function hear(){
  enter("Hören & Zeigen");
  const pool=PARTS;let deck=shuffle(pool).slice(0,10),i=0,stars=0,tries=0;
  function draw(){
    if(i>=deck.length){app.innerHTML=`<div class="stars" style="font-size:54px">${"⭐".repeat(stars)}</div><div class="done-box">👏 ${stars} / ${deck.length}</div><button class="primary" id="again" style="font-size:32px">🔁</button>`;$("#again").onclick=hear;say("Super!");return}
    const p=deck[i],opts=shuffle([p,...shuffle(pool.filter(x=>x!==p)).slice(0,3)]);tries=0;
    app.innerHTML=`<div class="stars">${"⭐".repeat(stars)}</div><div class="hear-top"><button class="big-ear primary" id="ear" aria-label="Wort anhören">🔊</button></div>
      <div class="picgrid">${opts.map(o=>`<button class="pic" data-k="${o.k}"><img src="${IMG[o.k]}" alt=""></button>`).join("")}</div>`;
    $("#ear").onclick=()=>say(p.w,.7);setTimeout(()=>say(p.w,.7),300);
    app.querySelectorAll(".pic").forEach(b=>b.onclick=()=>{
      if(b.dataset.k===p.k){b.classList.add("right");beep(true);if(tries===0)stars++;setTimeout(()=>{say(p.w,.7)},250);setTimeout(()=>{i++;draw()},1700)}
      else{tries++;b.classList.add("wrong");anim(b,"shake");beep(false);setTimeout(()=>say(p.w,.7),400)}
    });
  }
  draw();
}

// ---- 4. Reihenfolge Fußwaschung ----
function order(level){
  level=level||"alle";
  enter("Fußwaschung: Reihenfolge");
  const idx=level==="leicht"?STEPS_EASY:STEPS.map((_,i)=>i);
  const cards=shuffle(idx);let next=0,errors=0;
  app.innerHTML=`<div class="bar"><div class="toggle"><button data-l="leicht" class="${level==="leicht"?"on":""}">Leicht (6)</button><button data-l="alle" class="${level==="alle"?"on":""}">Alle (11)</button></div>
    <span class="pill" id="tm">⏱ 0:00</span><span class="pill" id="er">❌ 0</span><span class="spacer"></span><button id="re">Neu mischen</button></div>
    <p class="hint">Was kommt zuerst? Tippe die Karten in der richtigen Reihenfolge an. 🔊 = vorlesen.</p>
    <div class="order"><div class="col"><h3>Karten</h3><div id="pile">${cards.map(i=>`<div class="card" role="button" tabindex="0" data-i="${i}"><span class="e">${STEPS[i].e}</span><span class="t">${esc(STEPS[i].t)}</span><button class="s" aria-label="vorlesen">🔊</button></div>`).join("")}</div></div>
    <div class="col"><h3>Ablauf</h3><div id="seq"></div><div id="fin"></div></div></div>`;
  const stop=startTimer($("#tm"));
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>order(b.dataset.l));$("#re").onclick=()=>order(level);
  app.querySelectorAll("#pile .card").forEach(c=>{
    c.querySelector(".s").onclick=e=>{e.stopPropagation();say(STEPS[c.dataset.i].t)};
    c.onclick=()=>{
      if(+c.dataset.i===idx[next]){beep(true);next++;c.classList.add("placed");c.querySelector(".s").remove();
        c.insertAdjacentHTML("afterbegin",`<span class="n">${next}</span>`);c.onclick=null;$("#seq").appendChild(c);anim(c,"pop");
        if(next===idx.length){const s=stop();$("#fin").innerHTML=`<div class="done-box">Richtig! Zeit: ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} · Fehler: ${errors}</div><button class="primary" id="readall">🔊 Alles vorlesen</button>`;
          $("#readall").onclick=()=>say(idx.map((k,j)=>(j===0?"Zuerst: ":j===idx.length-1?"Zuletzt: ":"Dann: ")+STEPS[k].t).join(" "))}}
      else{errors++;$("#er").textContent="❌ "+errors;beep(false);anim(c,"shake")}
    };
  });
}
menu();
</script>
</body>
</html>
